[workspace]

[package]
name = "wincmd-dos"
version = "0.0.1"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
description = "32-bit Protected-Mode MS-DOS (DJGPP + CWSDPMI) target bindings and executables for win-cmd-rs"
repository = "https://github.com/SamuelMarks/win-cmd-rs"
publish = false

[lib]
name = "wincmd_dos"
path = "src/lib.rs"

[[bin]]
name = "wincmd"
path = "src/bin/wincmd.rs"

[[bin]]
name = "wincheck"
path = "src/bin/wincheck.rs"

[features]
default = ["host-sim"]
host-sim = []

[dependencies]
win-cmd-rs = { path = "../..", default-features = false, features = ["dos"] }

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

[lints.rust]
missing_docs = "deny"
unreachable_pub = "deny"
trivial_casts = "deny"
trivial_numeric_casts = "deny"
unused_qualifications = "deny"
unused_lifetimes = "deny"

[lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"
missing_crate_level_docs = "deny"
invalid_codeblock_attributes = "deny"
invalid_html_tags = "deny"
bare_urls = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
allow_attributes = "forbid"
allow_attributes_without_reason = "forbid"
let_underscore_must_use = "deny"
unused_result_ok = "deny"
map_err_ignore = "deny"
wildcard_enum_match_arm = "deny"
missing_docs_in_private_items = "deny"
missing_errors_doc = "deny"
missing_panics_doc = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
panic_in_result_fn = "deny"
indexing_slicing = "deny"
string_slice = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
arithmetic_side_effects = "deny"
cast_possible_truncation = "deny"
cast_sign_loss = "deny"
cast_possible_wrap = "deny"
missing_safety_doc = "deny"
undocumented_unsafe_blocks = "deny"
